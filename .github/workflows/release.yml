name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.1)'
        required: false
        default: ''
      changelog:
        description: 'Release Notes / Changelog'
        required: false
        default: 'Automated release update with performance improvements.'

permissions:
  contents: write

jobs:
  prepare:
    name: Determine Version & Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      version_code: ${{ steps.vars.outputs.version_code }}
      changelog: ${{ steps.vars.outputs.changelog }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version Info
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.$(git rev-list --count HEAD 2>/dev/null || echo 1)"
          fi

          # Clean version number without leading 'v'
          VERSION="${TAG#v}"

          # Extract version code and changelog from repository version.json if available
          JSON_CODE=""
          JSON_CHANGELOG=""
          if [ -f "version.json" ]; then
            python3 -c "import json; d=json.load(open('version.json',encoding='utf-8')); open('extracted_code.tmp','w',encoding='utf-8').write(str(d.get('versionCode',''))); open('extracted_changelog.tmp','w',encoding='utf-8').write(str(d.get('changelog','')))" 2>/dev/null || true
            if [ -f "extracted_code.tmp" ]; then
              JSON_CODE=$(cat extracted_code.tmp)
              rm -f extracted_code.tmp
            fi
            if [ -f "extracted_changelog.tmp" ]; then
              JSON_CHANGELOG=$(cat extracted_changelog.tmp)
              rm -f extracted_changelog.tmp
            fi
          fi

          if [ -n "$JSON_CODE" ]; then
            TOTAL_COMMITS="$JSON_CODE"
          else
            TOTAL_COMMITS=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          fi

          CHANGELOG="${{ github.event.inputs.changelog }}"
          if [ -z "$CHANGELOG" ]; then
            if [ -n "$JSON_CHANGELOG" ]; then
              CHANGELOG="$JSON_CHANGELOG"
            else
              CHANGELOG="Automated release ${TAG} with latest bug fixes and clipboard synchronization improvements."
            fi
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_code=${TOTAL_COMMITS}" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "${CHANGELOG}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build-windows:
    name: Build Windows Executable
    needs: [prepare]
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'windows/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt
          pip install pyinstaller

      - name: Inject Release Version into Windows App
        shell: bash
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          echo "Injecting version ${VER} into windows/updater.py..."
          python -c "import re; p='windows/updater.py'; c=open(p,'r',encoding='utf-8').read(); c=re.sub(r'__version__\s*=\s*\"[^\"]+\"', f'__version__ = \"${VER}\"', c); open(p,'w',encoding='utf-8').write(c)"

      - name: Build Windows Executable with PyInstaller
        working-directory: windows
        run: |
          pyinstaller WiFiClipboardSync.spec --clean --noconfirm

      - name: Smoke Test Windows Executable
        shell: pwsh
        working-directory: windows
        run: |
          Write-Host "Verifying executable binary integrity and launch..."
          $exePath = "dist\WiFiClipboardSync.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "WiFiClipboardSync.exe not found at $exePath"
            exit 1
          }
          # Start process and verify it boots without DLL runtime crash (e.g. LoadLibrary python312.dll error 126)
          $proc = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 3
          if ($proc.HasExited) {
            $exitCode = $proc.ExitCode
            Write-Error "Executable exited prematurely with code $exitCode. Missing DLL or runtime initialization crash."
            exit 1
          } else {
            Write-Host "Executable started successfully (PID: $($proc.Id)) without runtime errors. Terminating smoke test process..."
            Stop-Process -Id $proc.Id -Force
            Write-Host "Smoke test PASSED."
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: windows/dist/WiFiClipboardSync.exe
          if-no-files-found: error

  build-android:
    name: Build Android APK
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK with Dynamic Version
        working-directory: android
        run: |
          VER_NAME="${{ needs.prepare.outputs.version }}"
          VER_CODE="${{ needs.prepare.outputs.version_code }}"
          echo "Building Android APK with versionName=${VER_NAME}, versionCode=${VER_CODE}..."
          ./gradlew assembleDebug -PappVersionName="${VER_NAME}" -PappVersionCode="${VER_CODE}" --no-daemon

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Create Release Directory
        run: mkdir -p release_assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release_assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release_assets

      - name: Generate version.json
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VER="${{ needs.prepare.outputs.version }}"
          CODE="${{ needs.prepare.outputs.version_code }}"
          CHANGELOG="${{ needs.prepare.outputs.changelog }}"
          REPO="hasan-circuito/WiFi-clipboard-sync-"
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          # If version.json in repo matches this tag, use it directly to preserve exact metadata
          COPIED_FROM_REPO=false
          if [ -f "version.json" ]; then
            MATCHED=$(python3 -c "import json; d=json.load(open('version.json', encoding='utf-8')); print('yes' if d.get('tag_name') == '${TAG}' else 'no')" 2>/dev/null || echo "no")
            if [ "$MATCHED" = "yes" ]; then
              cp version.json release_assets/version.json
              COPIED_FROM_REPO=true
            fi
          fi

          if [ "$COPIED_FROM_REPO" != "true" ]; then
            python3 -c "import json, os; data={'tag_name':'${TAG}','version':'${VER}','versionCode':int('${CODE}'),'name':'Wi-Fi Clipboard Sync ${TAG}','apkUrl':f'https://github.com/${REPO}/releases/download/${TAG}/app-debug.apk','exeUrl':f'https://github.com/${REPO}/releases/download/${TAG}/WiFiClipboardSync.exe','changelog':'''${CHANGELOG}''','publishedAt':'${NOW}'}; json.dump(data,open('release_assets/version.json','w',encoding='utf-8'),indent=2,ensure_ascii=False)"
          fi
          cat release_assets/version.json

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Wi-Fi Clipboard Sync ${{ needs.prepare.outputs.tag }}
          body: |
            ## 📋 Wi-Fi Clipboard Sync ${{ needs.prepare.outputs.tag }}
            
            ${{ needs.prepare.outputs.changelog }}
            
            ### 📦 Download Assets:
            - 💻 **Windows**: [WiFiClipboardSync.exe](https://github.com/hasan-circuito/WiFi-clipboard-sync-/releases/download/${{ needs.prepare.outputs.tag }}/WiFiClipboardSync.exe)
            - 📱 **Android**: [app-debug.apk](https://github.com/hasan-circuito/WiFi-clipboard-sync-/releases/download/${{ needs.prepare.outputs.tag }}/app-debug.apk)
            - ℹ️ **Version Manifest**: [version.json](https://github.com/hasan-circuito/WiFi-clipboard-sync-/releases/download/${{ needs.prepare.outputs.tag }}/version.json)
          files: |
            release_assets/WiFiClipboardSync.exe
            release_assets/app-debug.apk
            release_assets/version.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
